<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연금 통합 대시보드 · 이성현</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0c10;
  --bg2:#111420;
  --bg3:#181c2a;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.13);
  --text:#e4e7f0;
  --text2:#8890a4;
  --text3:#484f64;
  --accent:#4f8ef7;
  --accent2:#6ee7b7;
  --gold:#f59e0b;
  --red:#ef4444;
  --radius:10px;
}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'IBM Plex Sans KR',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* ── 허브 네비게이션 ── */
.hub-nav{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  height:52px;
  background:var(--bg2);
  border-bottom:1px solid var(--border2);
  position:relative;
  z-index:100;
  gap:12px;
}
.hub-logo{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}
.hub-logo-mark{
  width:28px; height:28px;
  border-radius:6px;
  background:linear-gradient(135deg,#4f8ef7,#6ee7b7);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  color:#fff;
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:-0.05em;
  flex-shrink:0;
}
.hub-title-wrap{display:flex;flex-direction:column;gap:1px;}
.hub-title-main{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;font-weight:500;
  color:var(--text);letter-spacing:0.03em;
}
.hub-title-sub{
  font-size:11px;color:var(--text3);
  letter-spacing:0.05em;
}

/* ── 탭 ── */
.hub-tabs{
  display:flex;
  gap:3px;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:8px;
  padding:3px;
}
.hub-tab{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
  font-family:'IBM Plex Sans KR',sans-serif;
  font-weight:500;
  background:transparent;
  color:var(--text2);
  transition:all 0.18s;
  white-space:nowrap;
}
.hub-tab:hover{color:var(--text);background:rgba(255,255,255,0.04);}
.hub-tab.active{
  background:var(--bg2);
  color:var(--text);
  box-shadow:0 1px 4px rgba(0,0,0,0.4);
}
.hub-tab-dot{
  width:7px;height:7px;border-radius:50%;flex-shrink:0;
}

/* ── 우측 버튼 ── */
.hub-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.hub-btn{
  display:flex;
  align-items:center;
  gap:5px;
  padding:6px 13px;
  border:1px solid var(--border2);
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
  font-family:'IBM Plex Sans KR',sans-serif;
  background:transparent;
  color:var(--text2);
  transition:all 0.18s;
  white-space:nowrap;
}
.hub-btn:hover{border-color:var(--accent);color:var(--accent);}
.hub-btn.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.hub-btn.primary:hover{
  background:#3a7de8;
  border-color:#3a7de8;
  color:#fff;
}
.hub-sep{
  width:1px;height:22px;
  background:var(--border2);
}

/* ── 상태 바 ── */
.hub-statusbar{
  flex-shrink:0;
  height:24px;
  background:var(--bg3);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 20px;
  gap:20px;
}
.status-item{
  display:flex;align-items:center;gap:5px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;color:var(--text3);
}
.status-dot{
  width:5px;height:5px;border-radius:50%;
  animation:pulse 2.5s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
.status-item.live .status-dot{background:var(--accent2);}
.status-item span.val{color:var(--text2);}

/* ── iframe 컨테이너 ── */
.frames-wrap{
  flex:1;
  position:relative;
  overflow:hidden;
}
.frame-pane{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  transition:opacity 0.22s;
}
.frame-pane.hidden{
  opacity:0;
  pointer-events:none;
  z-index:0;
}
.frame-pane.visible{
  opacity:1;
  z-index:1;
}
.frame-pane iframe{
  flex:1;
  width:100%;
  border:none;
  display:block;
}

/* ── 로딩 스크린 ── */
.frame-loading{
  position:absolute;
  inset:0;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  z-index:10;
  transition:opacity 0.4s;
}
.frame-loading.done{opacity:0;pointer-events:none;}
.loading-spinner{
  width:32px;height:32px;
  border:2px solid var(--border2);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;color:var(--text2);
  letter-spacing:0.05em;
}

/* ── 분할 모드 ── */
.frames-wrap.split-mode .frame-pane{
  position:relative;
  width:50%;
  display:flex!important;
  opacity:1!important;
  pointer-events:auto!important;
}
.frames-wrap.split-mode{
  display:flex;
  flex-direction:row;
}
.split-divider{
  width:3px;
  background:var(--border2);
  cursor:col-resize;
  flex-shrink:0;
  position:relative;
  z-index:10;
  display:none;
}
.frames-wrap.split-mode .split-divider{display:block;}
.split-divider:hover,.split-divider.dragging{background:var(--accent);}

/* ── 반응형 ── */
@media(max-width:768px){
  .hub-title-sub,.hub-statusbar,.status-item:nth-child(n+3){display:none;}
  .hub-tab{padding:7px 10px;font-size:12px;}
  .hub-btn{padding:5px 9px;font-size:11px;}
}
</style>
</head>
<body>

<!-- ── 허브 네비게이션 ── -->
<nav class="hub-nav">
  <div class="hub-logo">
    <div class="hub-logo-mark">JL</div>
    <div class="hub-title-wrap">
      <div class="hub-title-main">PENSION · HUB</div>
      <div class="hub-title-sub">이성현 연금 통합 대시보드</div>
    </div>
  </div>

  <div class="hub-tabs">
    <button class="hub-tab active" id="tab1" onclick="switchTab(1)">
      <span class="hub-tab-dot" style="background:#4f8ef7;"></span>
      포트폴리오 모니터
    </button>
    <button class="hub-tab" id="tab2" onclick="switchTab(2)">
      <span class="hub-tab-dot" style="background:#6ee7b7;"></span>
      연금 시뮬레이터
    </button>
    <button class="hub-tab" id="tabSplit" onclick="toggleSplit()">
      <span style="font-size:11px;">⊞</span>
      분할 보기
    </button>
  </div>

  <div class="hub-actions">
    <button class="hub-btn" onclick="openNewWindow()" title="현재 탭을 새 창으로 열기">
      ↗ 새 창
    </button>
    <button class="hub-btn" onclick="openBothWindows()" title="두 대시보드 모두 새 창으로 열기">
      ⧉ 둘 다 열기
    </button>
    <div class="hub-sep"></div>
    <button class="hub-btn" onclick="reloadFrame()" title="새로고침">
      ↻
    </button>
  </div>
</nav>

<!-- ── 상태 바 ── -->
<div class="hub-statusbar">
  <div class="status-item live">
    <div class="status-dot"></div>
    <span>포트폴리오 모니터</span>
    <span class="val">이성현 연금 포트폴리오 · IRP·연금저축·ISA·위탁</span>
  </div>
  <div class="status-item" style="margin-left:auto;">
    <span style="color:var(--text3);">ETF 7종 · 계좌 5개</span>
  </div>
  <div class="status-item">
    <span style="color:var(--text3);">시뮬레이터</span>
    <span class="val">TIGER 486290 · 적립→재투자→3단계 인출</span>
  </div>
  <div class="status-item">
    <span id="statusTime" style="color:var(--text3);font-family:IBM Plex Mono,monospace;font-size:11px;"></span>
  </div>
</div>

<!-- ── 프레임 영역 ── -->
<div class="frames-wrap" id="framesWrap">
  
  <!-- 분할 모드용 구분선 -->
  <div class="split-divider" id="splitDivider"></div>

  <!-- 포트폴리오 모니터 (Pane 1) -->
  <div class="frame-pane visible" id="pane1">
    <div class="frame-loading" id="loading1">
      <div class="loading-spinner"></div>
      <div class="loading-label">포트폴리오 모니터 로딩 중...</div>
    </div>
    <iframe id="iframe1" title="이성현 연금 포트폴리오 모니터" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
  </div>

  <!-- 연금 시뮬레이터 (Pane 2) -->
  <div class="frame-pane hidden" id="pane2">
    <div class="frame-loading" id="loading2">
      <div class="loading-spinner"></div>
      <div class="loading-label">연금 시뮬레이터 로딩 중...</div>
    </div>
    <iframe id="iframe2" title="연금 자산 시뮬레이터 TIGER 486290" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
  </div>

</div>

/* ═══════════════════════════════════════════════════
   2.  Blob URL 생성
   ═══════════════════════════════════════════════════ */
function b64Decode(b64){
  const binStr = atob(b64);
  const bytes  = new Uint8Array(binStr.length);
  for(let i=0;i<binStr.length;i++) bytes[i]=binStr.charCodeAt(i);
  return bytes;
}

let URL1 = null, URL2 = null;
let blobsReady = false;

function makeBlobs(){
  const bytes1 = b64Decode(B64_PORTFOLIO);
  const bytes2 = b64Decode(B64_SIMULATOR);
  const blob1  = new Blob([bytes1], {type:'text/html;charset=utf-8'});
  const blob2  = new Blob([bytes2], {type:'text/html;charset=utf-8'});
  URL1 = URL.createObjectURL(blob1);
  URL2 = URL.createObjectURL(blob2);
  blobsReady = true;
}

/* ═══════════════════════════════════════════════════
   3.  상태 관리
   ═══════════════════════════════════════════════════ */
let currentTab  = 1;
let splitMode   = false;
let pane1Loaded = false;
let pane2Loaded = false;

/* ═══════════════════════════════════════════════════
   4.  탭 전환
   ═══════════════════════════════════════════════════ */
function switchTab(n){
  if(splitMode) return; // 분할 모드에서는 무시
  currentTab = n;

  document.getElementById('pane1').className = 'frame-pane ' + (n===1?'visible':'hidden');
  document.getElementById('pane2').className = 'frame-pane ' + (n===2?'visible':'hidden');
  document.getElementById('tab1').classList.toggle('active', n===1);
  document.getElementById('tab2').classList.toggle('active', n===2);
  document.getElementById('tabSplit').classList.remove('active');

  // 필요시 지연 로드
  if(n===1 && !pane1Loaded) loadPane(1);
  if(n===2 && !pane2Loaded) loadPane(2);
}

function loadPane(n){
  if(!blobsReady) return;
  const iframe  = document.getElementById('iframe'+n);
  const loading = document.getElementById('loading'+n);
  iframe.onload = ()=>{
    loading.classList.add('done');
    if(n===1) pane1Loaded=true;
    if(n===2) pane2Loaded=true;
  };
  iframe.src = (n===1) ? URL1 : URL2;
}

/* ═══════════════════════════════════════════════════
   5.  분할 보기
   ═══════════════════════════════════════════════════ */
function toggleSplit(){
  splitMode = !splitMode;
  const wrap = document.getElementById('framesWrap');
  const tab1 = document.getElementById('tab1');
  const tab2 = document.getElementById('tab2');
  const tabS = document.getElementById('tabSplit');

  if(splitMode){
    wrap.classList.add('split-mode');
    document.getElementById('pane1').className='frame-pane visible';
    document.getElementById('pane2').className='frame-pane visible';
    tab1.classList.remove('active');
    tab2.classList.remove('active');
    tabS.classList.add('active');
    if(!pane1Loaded) loadPane(1);
    if(!pane2Loaded) loadPane(2);
    // 분할선 드래그
    initSplitDrag();
  } else {
    wrap.classList.remove('split-mode');
    document.getElementById('pane1').style.width='';
    document.getElementById('pane2').style.width='';
    tabS.classList.remove('active');
    switchTab(currentTab);
  }
}

/* ── 분할선 드래그 ── */
function initSplitDrag(){
  const divider = document.getElementById('splitDivider');
  const wrap    = document.getElementById('framesWrap');
  let dragging  = false;

  divider.onmousedown = e=>{
    dragging=true;
    divider.classList.add('dragging');
    e.preventDefault();
  };
  document.onmousemove = e=>{
    if(!dragging||!splitMode) return;
    const rect  = wrap.getBoundingClientRect();
    const pct   = Math.max(20,Math.min(80,((e.clientX-rect.left)/rect.width)*100));
    document.getElementById('pane1').style.width = pct+'%';
    document.getElementById('pane2').style.width = (100-pct)+'%';
  };
  document.onmouseup = ()=>{
    dragging=false;
    divider.classList.remove('dragging');
  };
}

/* ═══════════════════════════════════════════════════
   6.  새 창 열기
   ═══════════════════════════════════════════════════ */
function openNewWindow(){
  const url = currentTab===1 ? URL1 : URL2;
  const title = currentTab===1 ? '포트폴리오 모니터' : '연금 시뮬레이터';
  if(!url){ alert('잠시 후 다시 시도해 주세요.'); return; }
  window.open(url, '_blank', 'width=1400,height=900,menubar=yes,toolbar=yes,scrollbars=yes,resizable=yes');
}

function openBothWindows(){
  if(!URL1||!URL2){ alert('잠시 후 다시 시도해 주세요.'); return; }
  window.open(URL1,'_blank','width=1300,height=860,menubar=yes,toolbar=yes,scrollbars=yes,resizable=yes,left=0,top=0');
  setTimeout(()=>{
    window.open(URL2,'_blank','width=1300,height=860,menubar=yes,toolbar=yes,scrollbars=yes,resizable=yes,left=100,top=40');
  }, 300);
}

function reloadFrame(){
  if(splitMode){
    document.getElementById('iframe1').contentWindow?.location.reload();
    document.getElementById('iframe2').contentWindow?.location.reload();
  } else {
    document.getElementById('iframe'+currentTab).contentWindow?.location.reload();
  }
}

/* ═══════════════════════════════════════════════════
   7.  시각 표시
   ═══════════════════════════════════════════════════ */
function updateClock(){
  const now = new Date();
  const t = now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('statusTime').textContent = t;
}
updateClock();
setInterval(updateClock, 1000);
